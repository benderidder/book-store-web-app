<!DOCTYPE html>
<html>
<head>
    <title>Book store</title>
</head>
<body>
    <h1>Welcome to the Book Store</h1>
    <p>Find your favorite books here!</p>
      <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
            </tr>
        </thead>
        <tbody>
            {% for row in data %}
            <tr>
                <td>{{ row.id }}</td>
                <td>{{ row.title }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
