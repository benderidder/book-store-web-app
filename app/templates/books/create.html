{% extends "layout.html" %}

{% block title %}
Create Book
{% endblock %}

{% block content %}
<div class="mdl-grid">
    <div class="mdl-cell mdl-cell--12-col">
        <h2 class="mdl-typography--headline">Create New Book</h2>

        <form method="POST" action="{{ url_for('books.create') }}">
            <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
                <input class="mdl-textfield__input" type="text" id="title" name="title" required>
                <label class="mdl-textfield__label" for="title">Title</label>
            </div>

            <div style="margin-top:16px;">
                <label for="author" class="mdl-typography--body-1">Author</label>
                <select id="author" name="author_id" class="mdl-textfield__input" style="display:block; margin-top:8px;">
                    <option value="">(No author)</option>
                    {% for a in authors %}
                    <option value="{{ a.id }}">{{ a.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="mdl-card__actions" style="margin-top:16px;">
                <button type="submit" class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored">
                    Create Book
                </button>
                <a href="{{ url_for('books.list') }}" class="mdl-button mdl-js-button mdl-button--raised">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
