version: '3.9'

services:
  # web:
  #   build: .
  #   ports:
  #     - "5000:5000"
  #   depends_on:
  #     - db

  db:
    image: postgres:13-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookstore_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'  # Expose the PostgreSQL port for external connections

volumes:
  db_data: