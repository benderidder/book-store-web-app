<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://code.getmdl.io/1.3.0/material.indigo-pink.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
    <script defer src="https://code.getmdl.io/1.3.0/material.min.js"></script>
</head>
<body>
    <div class="mdl-layout mdl-js-layout mdl-layout--fixed-header">
        <!-- Header -->
        <header class="mdl-layout__header">
            <div class="mdl-layout__header-row">
                <!-- Title -->
                <span class="mdl-layout-title">Book Store</span>
                <!-- Add spacer to align navigation to the right -->
                <div class="mdl-layout-spacer"></div>
            </div>
        </header>

        <!-- Navigation Drawer -->
        <div class="mdl-layout__drawer">
            <span class="mdl-layout-title">Book Store</span>
            <nav class="mdl-navigation">
                <a class="mdl-navigation__link" href="{{ url_for('home.index') }}">
                    <i class="material-icons">home</i> Home
                </a>
                <a class="mdl-navigation__link" href="{{ url_for('books.list') }}">
                    <i class="material-icons">library_books</i> Books
                </a>
                <a class="mdl-navigation__link" href="{{ url_for('books.create') }}">
                    <i class="material-icons">add</i> Add Book
                </a>
            </nav>
        </div>

        <!-- Main Content -->
        <main class="mdl-layout__content">
            <div class="page-content">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
</body>
</html>
